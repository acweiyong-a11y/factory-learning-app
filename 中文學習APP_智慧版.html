<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>廠區設備學習 APP</title>
<style>
:root{
  --bg:#0f1117; --card:#1e2130; --card2:#252840;
  --accent:#4f8ef7; --accent2:#7c3aed; --green:#22c55e; --red:#ef4444;
  --text:#f0f4ff; --sub:#8b97c6; --border:#2e3450;
  --radius:14px; --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100dvh;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + 8px)}
/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:#141624;border-top:1px solid var(--border);
  display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:none;border:none;
  color:var(--sub);font-size:11px;cursor:pointer;transition:.2s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:24px;height:24px}
/* ── PAGES ── */
.page{display:none;padding:16px 12px 0}
.page.active{display:block}
/* ── HEADER ── */
.page-title{font-size:20px;font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.badge{background:var(--accent2);color:#fff;border-radius:20px;
  padding:2px 10px;font-size:12px;font-weight:600}
/* ── LEARN GRID ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;border:1px solid var(--border);transition:.15s;active:scale(.97)}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card-body{padding:8px 9px 10px}
.card-zh{font-size:15px;font-weight:700;line-height:1.3}
.card-pin{font-size:11px;color:var(--accent);margin-top:2px;line-height:1.4}
.card-viet{font-size:10px;color:var(--sub);margin-top:1px}
/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);
  z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:420px;
  width:100%;overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal img{width:100%;max-height:52vw;object-fit:cover;display:block}
.modal-body{padding:18px 18px 20px}
.modal-zh{font-size:28px;font-weight:800;letter-spacing:.5px}
.modal-pin{font-size:15px;color:var(--accent);margin-top:5px;font-weight:500}
.modal-viet{font-size:13px;color:var(--sub);margin-top:4px}
.modal-btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;
  font-weight:600;cursor:pointer;transition:.15s}
.btn:active{opacity:.8}
.btn-play{background:var(--accent);color:#fff}
.btn-close{background:var(--card2);color:var(--sub)}
.modal-nav{display:flex;gap:8px;margin-top:10px}
.btn-nav{flex:1;padding:10px;background:var(--card2);color:var(--text);
  border:none;border-radius:10px;font-size:13px;cursor:pointer}
/* ── TEST START ── */
.test-start{display:flex;flex-direction:column;gap:14px}
.test-hero{background:linear-gradient(135deg,#1a237e,#4f8ef7);border-radius:var(--radius);
  padding:24px;text-align:center}
.test-hero h2{font-size:22px;font-weight:800;margin-bottom:6px}
.test-hero p{color:#a5c4ff;font-size:14px}
.q-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.q-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;
  padding:18px 0;font-size:20px;font-weight:800;color:var(--text);
  cursor:pointer;transition:.15s}
.q-btn:hover,.q-btn:active{border-color:var(--accent);color:var(--accent)}
.start-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;
  padding:16px;font-size:18px;font-weight:700;cursor:pointer;
  width:100%;margin-top:4px;transition:.15s}
.start-btn:active{opacity:.8}
/* ── TEST QUESTION ── */
#test-question{display:none}
.q-header{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px}
.q-prog{font-size:14px;color:var(--sub)}
.q-prog-bar{height:4px;background:var(--card2);border-radius:2px;margin-bottom:14px}
.q-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:.4s}
.audio-box{background:var(--card);border-radius:var(--radius);padding:18px;
  text-align:center;margin-bottom:14px}
.big-play{width:72px;height:72px;border-radius:50%;background:var(--accent);
  border:none;color:#fff;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;margin-bottom:10px;transition:.15s}
.big-play:active{transform:scale(.93)}
.audio-hint{font-size:13px;color:var(--sub)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{background:var(--card);border:2px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.choice:active{transform:scale(.97)}
.choice img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.choice.correct{border-color:var(--green)!important;background:#052e16}
.choice.wrong{border-color:var(--red)!important;background:#2d0a0a}
.choice.correct::after,.choice.wrong::after{
  position:absolute;top:6px;right:6px;width:26px;height:26px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff}
.choice.correct::after{content:"✓";background:var(--green)}
.choice.wrong::after{content:"✗";background:var(--red)}
.next-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:17px;font-weight:700;cursor:pointer;
  width:100%;margin-top:14px;display:none}
/* ── RESULT ── */
#test-result{display:none;text-align:center;padding-top:20px}
.result-score{font-size:72px;font-weight:900;line-height:1}
.result-label{font-size:16px;color:var(--sub);margin:6px 0 20px}
.result-detail{background:var(--card);border-radius:var(--radius);
  padding:16px;text-align:left;margin-bottom:16px}
.result-detail p{display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.result-detail p:last-child{border:none}
.result-detail span{color:var(--sub)}
.result-btns{display:flex;gap:10px}
/* ── HISTORY ── */
.hist-empty{text-align:center;color:var(--sub);padding:60px 0;font-size:15px}
.hist-card{background:var(--card);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;border:1px solid var(--border)}
.hist-top{display:flex;justify-content:space-between;align-items:center}
.hist-score{font-size:26px;font-weight:800}
.hist-score.pass{color:var(--green)}
.hist-score.fail{color:var(--red)}
.hist-meta{font-size:12px;color:var(--sub);margin-top:4px}
.clear-btn{background:none;border:1px solid var(--red);color:var(--red);
  border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;
  display:block;margin:0 auto 16px}
.clear-btn:active{opacity:.7}
/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;
  transform:translateX(-50%) translateY(20px);background:#1e2130;
  color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;
  border:1px solid var(--border);z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ── LEARN PAGE ── -->
<div id="page-learn" class="page active">
  <div class="page-title">📚 學習模式 <span class="badge" id="total-badge"></span></div>
  <div class="grid" id="learn-grid"></div>
</div>

<!-- ── TEST PAGE ── -->
<div id="page-test" class="page">
  <div class="page-title">📝 考試模式</div>
  <!-- Start Screen -->
  <div id="test-start" class="test-start">
    <div class="test-hero">
      <h2>聽讀音・選照片</h2>
      <p>播放中文讀音，從4張照片中選出正確的</p>
    </div>
    <div style="font-size:14px;color:var(--sub);font-weight:600">選擇題數</div>
    <div class="q-choice">
      <button class="q-btn" onclick="selectQ(10)">10題</button>
      <button class="q-btn" onclick="selectQ(20)">20題</button>
      <button class="q-btn" onclick="selectQ(40)">40題</button>
    </div>
    <div style="font-size:13px;color:var(--sub);text-align:center" id="q-selected">尚未選擇題數</div>
    <button class="start-btn" onclick="startTest()" id="start-btn" disabled>▶ 開始考試</button>
  </div>
  <!-- Question Screen -->
  <div id="test-question">
    <div class="q-header">
      <span class="q-prog" id="q-prog-txt"></span>
      <span style="font-size:13px;color:var(--sub)" id="q-timer-txt">00:00</span>
    </div>
    <div class="q-prog-bar"><div class="q-prog-fill" id="q-prog-fill"></div></div>
    <div class="audio-box">
      <button class="big-play" onclick="playQ()" id="play-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <div class="audio-hint">🔊 播放讀音 (iPhone必須手動點)</div>
    </div>
    <div class="choices" id="choices"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">下一題 →</button>
  </div>
  <!-- Result Screen -->
  <div id="test-result">
    <div class="result-score" id="res-score"></div>
    <div class="result-label" id="res-label"></div>
    <div class="result-detail" id="res-detail"></div>
    <div class="result-btns">
      <button class="btn btn-close" onclick="backToStart()">返回</button>
      <button class="btn btn-play" onclick="retryTest()">再考一次</button>
    </div>
  </div>
</div>

<!-- ── HISTORY PAGE ── -->
<div id="page-hist" class="page">
  <div class="page-title">📊 考試紀錄</div>
  <button class="clear-btn" onclick="clearHistory()">清除紀錄</button>
  <div id="hist-list"></div>
</div>

<!-- ── MODAL ── -->
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <img id="modal-img" src="" alt="">
    <div class="modal-body">
      <div class="modal-zh" id="modal-zh"></div>
      <div class="modal-pin" id="modal-pin"></div>
      <div class="modal-viet" id="modal-viet"></div>
      <div class="modal-btns">
        <button class="btn btn-play" onclick="speakCurrent()">🔊 播放讀音</button>
        <button class="btn btn-close" onclick="closeModal()">✕ 關閉</button>
      </div>
      <div class="modal-nav">
        <button class="btn-nav" onclick="modalPrev()">← 上一張</button>
        <button class="btn-nav" onclick="modalNext()">下一張 →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── NAV ── -->
<nav class="nav">
  <button class="nav-btn active" id="nav-learn" onclick="showPage('learn')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>學習
  </button>
  <button class="nav-btn" id="nav-test" onclick="showPage('test')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
    </svg>考試
  </button>
  <button class="nav-btn" id="nav-hist" onclick="showPage('hist')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>紀錄
  </button>
</nav>

<div class="toast" id="toast"></div>

// ── TTS ──────────────────────────────────────────────────────────────────────
let voices = [], ttsReady = false;
function loadVoices() {
  voices = speechSynthesis.getVoices();
  ttsReady = voices.length > 0;
}
speechSynthesis.addEventListener('voiceschanged', loadVoices);
loadVoices();
document.addEventListener('DOMContentLoaded', () => {
  const h = document.getElementById('audio-hint');
  if(h) h.textContent = isIOS ? '👆 請點喇叭播放讀音（iPhone）' : '🔊 自動播放讀音中...';
});

function getBestVoice() {
  const pref = [
    v => v.lang==='zh-TW' && /male|da|ming|bo/i.test(v.name),
    v => v.lang==='zh-CN' && /male|da|ming/i.test(v.name),
    v => v.lang==='zh-TW',
    v => v.lang==='zh-CN',
    v => v.lang.startsWith('zh'),
  ];
  for (const fn of pref) { const v=voices.find(fn); if(v) return v; }
  return null;
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

function speak(text, onEnd) {
  if (!window.speechSynthesis) { showToast('此裝置不支援語音'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  const v = getBestVoice();
  if (v) u.voice = v;
  u.rate = 0.85;
  u.pitch = 0.9;
  if (onEnd) u.onend = onEnd;
  speechSynthesis.speak(u);
}

// ── PAGES ────────────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='hist') renderHistory();
}

// ── LEARN ────────────────────────────────────────────────────────────────────
document.getElementById('total-badge').textContent = VOCAB.length + '張';
const grid = document.getElementById('learn-grid');
VOCAB.forEach((item,i) => {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<img src="${item.img}" alt="${item.zh}">
    <div class="card-body">
      <div class="card-zh">${item.zh}</div>
      <div class="card-pin">${item.pinyin}</div>
      <div class="card-viet">${item.viet}</div>
    </div>`;
  d.onclick = () => openModal(i);
  grid.appendChild(d);
});

// ── MODAL ────────────────────────────────────────────────────────────────────
let modalIdx = 0;
function openModal(i) {
  modalIdx = i;
  const item = VOCAB[i];
  document.getElementById('modal-img').src = item.img;
  document.getElementById('modal-zh').textContent = item.zh;
  document.getElementById('modal-pin').textContent = item.pinyin;
  document.getElementById('modal-viet').textContent = item.viet;
  document.getElementById('modal').classList.add('open');
  if(!isIOS) speak(item.zh);
}
function speakCurrent() { speak(VOCAB[modalIdx].zh); }
function closeModal(e) {
  if (!e || e.target===document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}
function modalPrev() { openModal((modalIdx-1+VOCAB.length)%VOCAB.length); }
function modalNext() { openModal((modalIdx+1)%VOCAB.length); }

// ── TEST ─────────────────────────────────────────────────────────────────────
let qTotal=0, qIdx=0, qCorrect=0, qItems=[], qAnswered=false;
let timerStart=0, timerInterval=null;

function selectQ(n) {
  qTotal = n;
  document.getElementById('q-selected').textContent = `已選擇 ${n} 題`;
  document.querySelectorAll('.q-btn').forEach(b=>{
    b.style.borderColor = (parseInt(b.textContent)===n) ? 'var(--accent)':'var(--border)';
    b.style.color = (parseInt(b.textContent)===n) ? 'var(--accent)':'var(--text)';
  });
  document.getElementById('start-btn').disabled = false;
}

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startTest() {
  const pool = shuffle([...VOCAB]).slice(0, qTotal);
  qItems = pool;
  qIdx = 0; qCorrect = 0; qAnswered = false;
  document.getElementById('test-start').style.display='none';
  document.getElementById('test-question').style.display='block';
  document.getElementById('test-result').style.display='none';
  timerStart = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  renderQuestion();
}

function updateTimer() {
  const s = Math.floor((Date.now()-timerStart)/1000);
  document.getElementById('q-timer-txt').textContent =
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function renderQuestion() {
  const item = qItems[qIdx];
  // progress
  document.getElementById('q-prog-txt').textContent = `${qIdx+1} / ${qTotal}`;
  document.getElementById('q-prog-fill').style.width = ((qIdx+1)/qTotal*100)+'%';
  // choices: pick 3 wrong + 1 correct
  const others = shuffle(VOCAB.filter(v=>v.file!==item.file)).slice(0,3);
  const choices = shuffle([item,...others]);
  const box = document.getElementById('choices');
  box.innerHTML = '';
  choices.forEach(c => {
    const d = document.createElement('div');
    d.className = 'choice';
    d.innerHTML = `<img src="${c.img}" alt="${c.zh}">`;
    d.onclick = () => answerQ(c.file===item.file, d, item);
    box.appendChild(d);
  });
  document.getElementById('next-btn').style.display='none';
  qAnswered = false;
  // auto-play
  
}

function playQ() {
  speak(qItems[qIdx].zh);
}

function answerQ(correct, el, item) {
  if (qAnswered) return;
  qAnswered = true;
  if (correct) {
    el.classList.add('correct');
    qCorrect++;
    showToast('✓ 正確！');
  } else {
    el.classList.add('wrong');
    // highlight correct
    const imgs = document.querySelectorAll('.choice img');
    imgs.forEach(img => {
      if (img.src===item.img) img.closest('.choice').classList.add('correct');
    });
    showToast('✗ 答錯了');
    speak(item.zh);
  }
  document.getElementById('next-btn').style.display='block';
}

function nextQ() {
  qIdx++;
  if (qIdx>=qTotal) { showResult(); return; }
  renderQuestion();
}

function showResult() {
  clearInterval(timerInterval);
  const dur = Math.floor((Date.now()-timerStart)/1000);
  const pct = Math.round(qCorrect/qTotal*100);
  document.getElementById('test-question').style.display='none';
  document.getElementById('test-result').style.display='block';
  document.getElementById('res-score').textContent = pct+'%';
  document.getElementById('res-score').style.color = pct>=60?'var(--green)':'var(--red)';
  document.getElementById('res-label').textContent = pct>=80?'🎉 優秀！':pct>=60?'👍 合格':'💪 繼續加油';
  const mm=String(Math.floor(dur/60)).padStart(2,'0'), ss=String(dur%60).padStart(2,'0');
  document.getElementById('res-detail').innerHTML = `
    <p><span>正確題數</span> ${qCorrect} / ${qTotal}</p>
    <p><span>考試時間</span> ${mm}:${ss}</p>
    <p><span>考試日期</span> ${new Date().toLocaleDateString('zh-TW')}</p>
    <p><span>考試時刻</span> ${new Date().toLocaleTimeString('zh-TW')}</p>`;
  saveHistory(qTotal, qCorrect, dur, pct);
}

function backToStart() {
  document.getElementById('test-start').style.display='flex';
  document.getElementById('test-question').style.display='none';
  document.getElementById('test-result').style.display='none';
}

function retryTest() {
  backToStart();
  if (qTotal) startTest();
}

// ── HISTORY ──────────────────────────────────────────────────────────────────
function saveHistory(total, correct, dur, pct) {
  const h = JSON.parse(localStorage.getItem('exam_history')||'[]');
  h.unshift({total,correct,dur,pct,date:new Date().toISOString()});
  if(h.length>100) h.pop();
  localStorage.setItem('exam_history', JSON.stringify(h));
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('exam_history')||'[]');
  const box = document.getElementById('hist-list');
  if (!h.length) { box.innerHTML='<div class="hist-empty">尚無考試紀錄</div>'; return; }
  box.innerHTML = h.map((r,i) => {
    const d=new Date(r.date);
    const mm=String(Math.floor(r.dur/60)).padStart(2,'0'), ss=String(r.dur%60).padStart(2,'0');
    return `<div class="hist-card">
      <div class="hist-top">
        <div>
          <div class="hist-score ${r.pct>=60?'pass':'fail'}">${r.pct}%</div>
          <div class="hist-meta">第${i+1}次 ｜ ${r.correct}/${r.total}題 ｜ 時間 ${mm}:${ss}</div>
          <div class="hist-meta">${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW')}</div>
        </div>
        <div style="font-size:32px">${r.pct>=80?'🏆':r.pct>=60?'✅':'📚'}</div>
      </div>
    </div>`;
  }).join('');
}

function clearHistory() {
  if (!confirm('確定要清除所有考試紀錄？')) return;
  localStorage.removeItem('exam_history');
  renderHistory();
  showToast('紀錄已清除');
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
</html>
